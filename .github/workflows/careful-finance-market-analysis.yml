name: Careful Finance Market Analysis

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      AGENT_SERVICE_OPPORTUNITIES_URL: ${{ secrets.AGENT_SERVICE_OPPORTUNITIES_URL }}
      RUNNER_INGEST_TOKEN: ${{ secrets.RUNNER_INGEST_TOKEN }}
      USE_CLAUDE_CODE: ${{ vars.USE_CLAUDE_CODE }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
      BANKR_LLM_KEY: ${{ secrets.BANKR_LLM_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Claude Code
        if: vars.USE_CLAUDE_CODE == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Publish latest Careful Finance market analysis
        run: node scripts/careful-finance/market-analysis.mjs
